<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Carrinho - Hardware Atelier</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-light bg-light shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="pagina_inicial.html">
      <i class="bi bi-shop"></i> Hardware Atelier
    </a>
  </div>
</nav>

<div class="container mt-5">

  <h2 class="mb-4">
    <i class="bi bi-cart-fill"></i> Seu Carrinho
  </h2>

 
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <ul class="list-group" id="cart-items"></ul>
    </div>
  </div>

 
  <div class="card shadow-sm">
    <div class="card-body d-flex justify-content-between align-items-center">
      <h4>Total:</h4>
      <h4 class="text-success">R$ <span id="cart-total">0.00</span></h4>
    </div>
  </div>

  <!-- botoes -->
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-secondary">Limpar Carrinho</button>

    <button class="btn btn-success">Finalizar Compra</button>

    <a href="pagina_inicial.html" class="btn btn-primary ms-auto">
      Continuar Comprando
    </a>
  </div>

</div>
</body>
</html>
